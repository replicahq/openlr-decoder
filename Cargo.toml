[package]
name = "openlr_decoder"
version = "0.2.7"
edition = "2021"
license = "MIT"
description = "Fast OpenLR location reference decoder"
repository = "https://github.com/replicahq/openlr-decoder"
keywords = ["openlr", "location", "gis", "map-matching"]

[lib]
name = "openlr_decoder"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
openlr = "0.4"
petgraph = "0.8"
rstar = "0.14"
geo = { version = "0.33", features = ["serde"] }
geo-types = { version = "0.7", features = ["serde"] }
parquet = { version = "59", features = ["arrow"] }
arrow = { version = "59", features = ["ffi"] }
geozero = { version = "0.15", features = ["with-wkb", "with-wkt", "with-geo"] }
geoarrow-array = "0.9"
geoarrow-schema = "0.9"
geo-traits = "0.3"
rayon = "1.10"
ahash = "0.8"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
anyhow = "1"
pyo3 = { version = "0.30", features = ["extension-module"], optional = true }
pyo3-arrow = { version = "0.20", optional = true }

[features]
default = []
python = ["pyo3", "pyo3-arrow"]

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
