[package]
name = "openlr_decoder"
version = "0.3.0"
edition = "2021"
license = "MIT"
description = "Fast OpenLR location reference decoder"
repository = "https://github.com/replicahq/openlr-decoder"
keywords = ["openlr", "location", "gis", "map-matching"]

[lib]
name = "openlr_decoder"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[workspace]
members = [".", "crates/road-network", "crates/map-matcher"]

[dependencies]
road-network = { path = "crates/road-network" }
openlr = "0.4"
petgraph = "0.8"
geo = { version = "0.33", features = ["serde"] }
parquet = { version = "59", features = ["arrow"] }
arrow = { version = "59", features = ["ffi"] }
rayon = "1.10"
thiserror = "2"
anyhow = "1"
pyo3 = { version = "0.30", features = ["extension-module"], optional = true }
pyo3-arrow = { version = "0.20", optional = true }

[features]
default = []
python = ["pyo3", "pyo3-arrow"]
# Exposes `test_utils` to integration tests (enabled via the self dev-dependency).
test-utils = ["road-network/test-utils"]

[dev-dependencies]
openlr_decoder = { path = ".", features = ["test-utils"] }
road-network = { path = "crates/road-network", features = ["test-utils"] }

[profile.release]
lto = true
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"
