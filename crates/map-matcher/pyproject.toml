[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "map-matcher"
version = "0.1.0"
description = "HMM map matching of GPS traces onto a road network"
license = { text = "MIT" }
authors = [{ name = "Replica", email = "engineering@replicahq.com" }]
requires-python = ">=3.10"
dependencies = ["pyarrow>=14"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering :: GIS",
]

[tool.maturin]
features = ["python"]
python-source = "python"
module-name = "map_matcher._map_matcher"
